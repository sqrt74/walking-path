<section class="animation-card" aria-labelledby="scene-title">
  <div class="canvas-wrap">
    <canvas #sceneCanvas aria-describedby="scene-description" aria-label="Črtasti možic hodi po poti"></canvas>
  </div>
  <div class="controls">
    <div>
      <h2 id="scene-title">Osnovna hoja</h2>
      <p id="scene-description">Dva koraka, večplastna pot in mimoidoči predmeti.</p>
    </div>
    <div class="control-row">
      <button type="button" (click)="togglePlayback()">{{ isPlaying() ? 'Premor' : 'Predvajaj' }}</button>
      <label>
        <span>Hitrost {{ speed().toFixed(1) }}×</span>
        <input type="range" min="0.5" max="2" step="0.1" [value]="speed()" (input)="setSpeed($event)" />
      </label>
    </div>
  </div>
</section>
